<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17664d">
<title>随手清单 · 把今天过得轻一点</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#243c33;background:#f4f6f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:40px 20px 80px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px}.brand{font-weight:800;letter-spacing:2px}.badge{font-size:12px;background:#e2ebdf;padding:7px 12px;border-radius:30px}h1{font-size:clamp(32px,7vw,46px);letter-spacing:-2px;margin:10px 0 12px;line-height:1.2}.intro{color:#687970;line-height:1.8}.date{color:#17664d;font-size:13px;font-weight:700}.panel{background:white;border:1px solid #e1e8dd;border-radius:24px;padding:24px;margin-top:28px;box-shadow:0 12px 40px #213e3307}.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.summary strong{font-size:18px}.count{color:#64756b;font-size:13px}progress{appearance:none;width:100%;height:6px;border:0;border-radius:6px;overflow:hidden;background:#edf1e8}progress::-webkit-progress-bar{background:#edf1e8}progress::-webkit-progress-value{background:#438965}progress::-moz-progress-bar{background:#438965}form{display:flex;gap:8px;margin:26px 0 18px}input{min-width:0;flex:1;border:1px solid #d5dfd3;background:#fafbf8;border-radius:12px;padding:13px;font:inherit;font-size:16px}button{font:inherit;cursor:pointer;min-height:44px;border:0;border-radius:12px;padding:10px 15px;background:#edf2e9;color:#334e40}button:focus-visible,input:focus-visible{outline:3px solid #91b79d;outline-offset:3px}.add{background:#17664d;color:white}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{font-size:13px;background:transparent}.filters button[aria-pressed=true]{background:#e6efe3;color:#17664d;font-weight:700}ul{list-style:none;padding:0;margin:16px 0}li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0e8}li label{display:flex;flex:1;align-items:center;gap:12px;min-width:0;cursor:pointer;min-height:44px}li input{flex:none;width:22px;height:22px;accent-color:#17664d}li span{overflow-wrap:anywhere}li.done span{text-decoration:line-through;color:#8a958b}.delete{background:transparent;color:#7e8a7f;font-size:20px;padding:8px 12px}.empty{text-align:center;padding:30px 8px;color:#879184;line-height:1.8}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#80907f;font-size:12px}.footer button{font-size:12px;background:transparent;color:#647862;padding:8px}.note{font-size:12px;text-align:center;color:#7f8c7d;margin-top:24px;line-height:1.8}#status{font-size:13px;color:#876127;min-height:20px}@media(max-width:380px){main{padding:26px 14px}.panel{padding:18px}header{margin-bottom:32px}.badge{font-size:11px}form{gap:6px}.add{padding:10px 12px}}
</style>
</head>
<body><main>
<header><div class="brand">◒ 随手清单</div><span class="badge">一件一件，慢慢来</span></header>
<div class="date" id="date"></div><h1>今天，<br>留一点空间给自己。</h1><p class="intro">记下想做的小事，把心里的忙碌放下来。</p>
<section class="panel" aria-label="我的任务">
<div class="summary"><strong>今日清单</strong><span class="count" id="count"></span></div>
<progress id="progress" value="0" max="1" aria-label="任务完成进度"></progress>
<form id="form"><input id="task" aria-label="新任务" placeholder="接下来，想做点什么？" maxlength="120" required autocomplete="off"><button class="add" type="submit">＋ 添加</button></form>
<div class="filters" aria-label="筛选任务"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="active" aria-pressed="false">待完成</button><button type="button" data-filter="done" aria-pressed="false">已完成</button></div>
<ul id="list"></ul><p id="empty" class="empty">清单还是空的。<br>从一件小事开始吧 ☀</p>
<div class="footer"><span id="remaining"></span><button id="clear" type="button">清除已完成</button></div><p id="status" role="status" aria-live="polite"></p>
</section><p class="note">数据仅保存在当前浏览器，无需登录。<br>换设备或清理浏览器数据后，清单不会同步。</p>
</main><script src="app.js"></script></body></html>
